name: 🌐 Deploy BuildSmart Web to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Build ──────────────────────────────────────────────────────────────
  # This job must NOT declare `environment: github-pages`: the github-pages
  # environment has a deployment branch policy that only allows `main`, so a
  # job-level environment reference makes tag-triggered runs fail instantly
  # at startup (no runner assigned, 0 steps) instead of building the bundle.
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Flutter Setup ─────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Dependencies ──────────────────────────────────────────
      - name: 📦 Install Flutter Dependencies
        working-directory: construction_management_system_Flutter
        run: flutter pub get

      # ── Build ─────────────────────────────────────────────────
      # BASE_URL default is the production backend; --base-href is required
      # for project-page hosting (https://<user>.github.io/<repo>/).
      - name: 🔨 Build Web (release)
        working-directory: construction_management_system_Flutter
        run: flutter build web --release --base-href=/${{ github.event.repository.name }}/

      # ── Stage Pages artifact ──────────────────────────────────
      # Deploy only from the main branch. Tag-triggered runs still build
      # the web bundle (compile verification) but skip publishing, because
      # the github-pages environment protection rules reject tag refs.
      - name: ⚙️ Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: construction_management_system_Flutter/build/web

  # ── Deploy ─────────────────────────────────────────────────────────────
  # Runs on main only; the `github-pages` environment (which enforces the
  # main-only deployment branch policy) is scoped to this job alone.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
