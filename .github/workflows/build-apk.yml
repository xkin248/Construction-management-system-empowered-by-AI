# Copy this file to .github/workflows/build-apk.yml
name: 🏗️ Build & Release BuildSmart APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: 'manual-build'

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            construction_management_system_Flutter/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('construction_management_system_Flutter/android/**/build.gradle') }}

      - name: 📦 Install Flutter Dependencies
        working-directory: construction_management_system_Flutter
        run: flutter pub get

      - name: 🔨 Build Release APK (Debug Signing)
        working-directory: construction_management_system_Flutter
        run: flutter build apk --release

      - name: 📝 Rename APK File (safe)
        id: rename_apk
        run: |
          set -euo pipefail
          # Resolve VERSION: prefer tag name, then workflow input, then fallback
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" == "refs/heads/main" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="manual"
          fi

          APK_SRC="construction_management_system_Flutter/build/app/outputs/flutter-apk/app-release.apk"
          echo "Looking for APK at $APK_SRC"
          if [ ! -f "$APK_SRC" ]; then
            echo "APK not found at $APK_SRC"
            echo "APK_PRESENT=false" >> $GITHUB_ENV
            echo "APK_NAME=" >> $GITHUB_ENV
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            # print directories to help debugging
            ls -la construction_management_system_Flutter/build/app/outputs || true
          else
            TARGET="BuildSmart-${VERSION}.apk"
            cp "$APK_SRC" "$TARGET"
            echo "APK_NAME=${TARGET}" >> $GITHUB_ENV
            echo "APK_PRESENT=true" >> $GITHUB_ENV
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
          fi

      - name: Debug: flutter doctor & outputs (always print for diagnosis)
        if: always()
        working-directory: construction_management_system_Flutter
        run: |
          echo "---- flutter doctor ----"
          flutter doctor -v || true
          echo "---- build outputs ----"
          ls -la build/app/outputs/flutter-apk || true

      - name: 📤 Upload APK as Artifact
        if: env.APK_PRESENT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.APK_PRESENT == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "BuildSmart ${{ github.ref_name }}"
          body: |
            ## 📱 BuildSmart ${{ github.ref_name }} - Android APK

            ### 📥 安装方法 (How to Install)
            1. 在 Android 手机上下载下方的 `.apk` 文件
            2. 打开下载的 APK 文件
            3. 如果提示"未知来源"，请在设置中允许安装
            4. 安装完成后即可使用！

            ---
            ### 📥 Installation (English)
            1. Download the `.apk` file below on your Android phone
            2. Open the downloaded APK file
            3. If prompted about "Unknown sources", allow installation in Settings
            4. Done! Open the app and enjoy.

            ---
            > ⚠️ **Note**: This app requires the backend server to be running to access data.
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: build-apk
    if: always()
    steps:
      - name: ✅ Build Status
        run: |
          if [ "${{ needs.build-apk.result }}" == "success" ]; then
            echo "✅ APK built and released successfully!"
          else
            echo "❌ Build failed. Check the logs above."
          fi
