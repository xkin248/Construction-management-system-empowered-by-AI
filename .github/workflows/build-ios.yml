name: 🍏 Build & Release BuildSmart iOS

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.26.0)'
        required: false
        default: 'manual-build'

permissions:
  contents: write

jobs:
  build-ios:
    name: 🍎 Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Flutter Setup ─────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      # ── Dependencies ──────────────────────────────────────────
      - name: 📦 Install Flutter Dependencies
        working-directory: construction_management_system_Flutter
        run: flutter pub get

      # ── Optional Firebase iOS config (skipped when secret absent) ──
      - name: 🔥 Decode GoogleService-Info.plist (optional)
        working-directory: construction_management_system_Flutter
        continue-on-error: true
        env:
          GSP_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "${GSP_B64:-}" ]; then
            echo "$GSP_B64" | base64 -d > ios/Runner/GoogleService-Info.plist
            # register the plist as a bundled resource
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string BuildSmart" ios/Runner/Info.plist 2>/dev/null || true
            ls -la ios/Runner/GoogleService-Info.plist
          else
            echo "ℹ️ No GOOGLE_SERVICE_INFO_PLIST_BASE64 secret; FCM will be skipped on iOS."
          fi

      # ── Build (no codesign → installable on jailbroken / resignable) ──
      - name: 🔨 Build iOS Release (no codesign)
        working-directory: construction_management_system_Flutter
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=BASE_URL=https://construction-management-system-empowered.onrender.com

      # ── Package into an unsigned .ipa ─────────────────────────
      - name: 📦 Package unsigned IPA
        id: package_ipa
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            ""|refs/heads/main) VERSION="${{ github.event.inputs.version_name }}" ;;
          esac
          [ -z "$VERSION" ] && VERSION="manual"
          APP_DIR="construction_management_system_Flutter/build/ios/iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            echo "❌ Runner.app not found"; ls -la "$APP_DIR" || true; exit 1
          fi
          cd "$APP_DIR"
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          IPA="BuildSmart-${VERSION}-ios-unsigned.ipa"
          zip -rqy "$IPA" Payload
          cp "$IPA" "$GITHUB_WORKSPACE/$IPA"
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/$IPA"

      # ── Debug (always) ────────────────────────────────────────
      - name: 🔍 Debug Info
        if: always()
        run: |
          flutter --version || true
          xcodebuild -version || true

      # ── Upload IPA artifact ───────────────────────────────────
      - name: 📤 Upload IPA Artifact
        if: env.IPA_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30

      # ── GitHub Release (tag only) ─────────────────────────────
      - name: 🚀 Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.IPA_NAME != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "BuildSmart ${{ github.ref_name }}"
          body: |
            ## 🍏 BuildSmart ${{ github.ref_name }} - iOS IPA (unsigned)

            ### 📥 安装方法 (How to Install)
            - 该 IPA **未签名**，需使用 AltStore / Sideloadly / TrollStore 等工具自签名后安装到 iPhone。
            - 或使用自己的 Apple Developer 证书重新签名：
              `codesign -f -s "Apple Distribution: ..." Payload/Runner.app`
            - 首次启动需在「设置 → 通用 → VPN与设备管理」中信任证书。

            ### 📥 Installation (English)
            - This IPA is **unsigned**. Sideload it with AltStore / Sideloadly / TrollStore, or re-sign it with your own Apple Developer certificate.
            - Trust the certificate under Settings → General → VPN & Device Management.

            ---
            > ⚠️ The app requires the live backend to load data.
            > 📱 Android users: use the `.apk` asset in this same release.
          files: ${{ env.IPA_NAME }}
          draft: false
          prerelease: false
