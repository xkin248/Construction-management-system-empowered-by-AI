services:
  - type: web
    name: buildsmart-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: construction_management_system_Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: FENCE_LEAVE_TOLERANCE_MIN
        value: "10"
      - key: HEARTBEAT_INTERVAL_MIN
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
